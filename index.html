<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Desk 盯盤台</title>
<meta name="description" content="免費開源的美股看盤臺：K 線、技術指標、類股熱力圖、新聞、AI 日報。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b1220'/><path d='M6 22l6-7 5 4 9-11' stroke='%2322c55e' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">◆</span> Stock Desk <small>盯盤台</small></div>
  <button class="search-btn" id="openSearch" type="button" aria-label="搜尋股票">
    <span>🔍 搜尋美股代號 / 公司名</span><kbd id="kbdHint">Ctrl K</kbd>
  </button>
  <nav class="nav">
    <a href="#chart-sec">K 線</a><a href="#heat-sec">熱力圖</a><a href="#news-sec">新聞</a><a href="#ai-sec">AI 日報</a>
  </nav>
</header>
<div class="tape" id="tape"></div>

<main>
  <section id="chart-sec" class="card">
    <div class="card-head">
      <h2><span id="curSym">NASDAQ:NVDA</span></h2>
      <div class="head-actions">
        <button id="starBtn" type="button" class="btn">☆ 加入自選</button>
        <button id="copyLink" type="button" class="btn ghost">複製連結</button>
      </div>
    </div>
    <div class="info" id="info"></div>
    <div class="grid-chart">
      <div class="chart" id="chart"></div>
      <div class="side">
        <div class="ta" id="ta"></div>
        <div class="watch">
          <div class="sub-head"><h3>我的自選 Watchlist</h3><button class="btn tiny ghost" id="syncWatch" type="button" title="把自選股同步到每日 AI 日報">同步到日報</button></div>
          <div id="chips" class="chips"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>自選股即時報價 Quotes</h2></div>
    <div class="quotes" id="quotes"></div>
  </section>

  <section id="heat-sec" class="card">
    <div class="card-head">
      <h2>全市場類股熱力圖 Heatmap</h2>
      <select id="heatSrc" aria-label="熱力圖範圍">
        <option value="SPX500">標普 500</option>
        <option value="NASDAQ100">納斯達克 100</option>
        <option value="DJDJI">道瓊斯 30</option>
        <option value="AllUSA">全部美股</option>
      </select>
    </div>
    <div class="heat" id="heat"></div>
  </section>

  <section id="news-sec" class="grid-2">
    <div class="card">
      <div class="card-head"><h2>個股新聞 <span class="muted" id="newsSym"></span></h2></div>
      <div class="news" id="newsSymW"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>市場頭條 Top Stories</h2></div>
      <div class="news" id="newsAll"></div>
    </div>
  </section>

  <section class="grid-2">
    <div class="card">
      <div class="card-head"><h2>漲跌榜 Movers</h2></div>
      <div class="hot" id="hot"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>財報資料 Financials</h2></div>
      <div class="hot" id="fin"></div>
    </div>
  </section>

  <section id="ai-sec" class="card">
    <div class="card-head">
      <h2>🤖 AI 日報 Daily Report</h2>
      <select id="reportDate" aria-label="選擇日期"></select>
    </div>
    <div id="report"><p class="muted">載入中…</p></div>
  </section>
</main>

<footer class="foot">
  行情與圖表由 <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> 提供 · AI 日報由 Google Gemini 產生，僅供參考，不構成投資建議。
</footer>

<div class="modal" id="search" hidden>
  <div class="modal-box" role="dialog" aria-label="搜尋">
    <input id="q" type="search" placeholder="輸入代號或公司名，如 TSLA / apple" autocomplete="off" spellcheck="false">
    <ul id="results" class="results"></ul>
    <p class="hint">↑↓ 選擇 · Enter 開啟 · Esc 關閉</p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
